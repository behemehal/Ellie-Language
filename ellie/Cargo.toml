[package]
name = "ellie"
version = "0.1.0"
edition = "2021"
authors = ["Ahmetcan Aksu <ahmetcanaksu@behemehal.org>"]
license = "GPL-2.0"
description = "The Ellie language all-in-one toolchain binary"

[[bin]]
name = "ellie"
path = "src/main.rs"

[dependencies]
clap = { version = "3.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
path-absolutize = { version = "3.0.10" }
bincode = { version = "1.3.3" }
libloading = "0.8.6"
ellie_engine = { path = "../ellie_engine", default-features = false, features = [
    "compiler",
    "vm_gen2",
    "cli-utils",
    "std",
] }
ellie_native_bridge = { path = "../EllieNativeBridge", features = ["rust_bridge"] }
